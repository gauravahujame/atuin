name: Sync Release to Gitea & Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  sync-to-gitea:
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '-patch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Gitea mirror sync
        run: |
          echo "Waiting for Gitea mirror to sync tag..."
          timeout 180 bash -c '
            while ! curl -f -s "https://gitea.gauravahuja.dev/gauravahujame/atuin/archive/${{ github.ref_name }}.tar.gz" > /dev/null 2>/dev/null; do
              echo "Tag not yet available, waiting..."
              sleep 10
            done
          '

      - name: Create Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Get release notes safely
          RELEASE_BODY=$(gh api repos/${{ github.repository }}/releases/tags/${TAG_NAME} --jq '.body' || echo "Release $TAG_NAME")

          curl --fail -X POST \
            "https://gitea.gauravahuja.dev/api/v1/repos/gauravahujame/atuin/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"Atuin $TAG_NAME\",
              \"body\": $(echo "$RELEASE_BODY" | jq -Rs .),
              \"draft\": false,
              \"prerelease\": ${{ github.event.release.prerelease }}
            }"

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: sync-to-gitea
    if: contains(github.ref_name, '-patch')
    steps:
      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v4
        with:
          repository: gauravahujame/homebrew-tap
          token: ${{ secrets.GH_PAT_HOMEBREW_TAP }}
          path: homebrew-tap

      - name: Calculate SHA256 and update formula
        env:
          TAG_NAME: ${{ github.ref_name }}
          GITEA_URL: "https://gitea.gauravahuja.dev/gauravahujame/atuin/archive"
        run: |
          cd homebrew-tap

          # Download tarball from Gitea
          TARBALL_URL="${GITEA_URL}/${TAG_NAME}.tar.gz"
          curl -L "$TARBALL_URL" -o /tmp/atuin-source.tar.gz

          # Calculate SHA256
          SHA256=$(shasum -a 256 /tmp/atuin-source.tar.gz | awk '{print $1}')
          echo "Calculated SHA256: $SHA256"

          # Extract version without 'v' prefix and '-patch' suffix
          VERSION="${TAG_NAME#v}"  # Remove 'v' prefix
          VERSION="${VERSION%-patch}"  # Remove '-patch' suffix

          # Update formula
          # If the formula uses 'version "..."', we update that (dynamic URL).
          # If not, we update the 'url "..."' line directly.

          if grep -q 'version "' Formula/atuin.rb; then
            echo "Detected 'version' field, updating version and sha256..."
            sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/atuin.rb
          else
            echo "No 'version' field detected, updating url and sha256..."
            sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/atuin.rb
          fi

          # Always update digest
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/atuin.rb

          # Show changes
          echo "Updated formula:"
          cat Formula/atuin.rb

      - name: Commit and push changes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd homebrew-tap

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add Formula/atuin.rb
          git commit -m "atuin: update to $TAG_NAME"
          git push origin main

      - name: Verify Homebrew installation
        run: |
          echo "✓ Homebrew tap updated successfully!"
          echo "Users can now run:"
          echo "  brew update"
          echo "  brew upgrade gaurav/tap/atuin"
